[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "picoface"
version = "0.1.0"
description = "A small PyTorch-backed library for building and training real classifiers and generators from simple function calls."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.urls]
Repository = "https://github.com/jporterdal/picoface"

[tool.setuptools.packages.find]
where = ["src"]
