[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "picoface"
version = "0.1.0"
description = "A small PyTorch-backed library for building and training real classifiers and generators from simple function calls."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",  # install the CPU wheel first — see README's Install section
    "numpy>=1.24",
    "matplotlib>=3.7",
    "pillow>=10",
]
keywords = ["deep-learning", "pytorch", "education", "classifier", "vae", "generative-model"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Education",
]

[project.optional-dependencies]
dev = ["pytest>=7", "build", "twine"]

[project.urls]
Repository = "https://github.com/jporterdal/picoface"

[tool.setuptools.packages.find]
where = ["src"]
